<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="planner-api" content="/api/state">
  <meta name="planner-ics" content="/api/ics">
  <meta name="planner-canvas" content="/api/canvas">
  <title>Desktop pet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@500;600&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../motion.css">
  <link rel="stylesheet" href="../pets.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body data-mode="pet" class="pet-desktop">
  <!-- The whole screen is the pet's board. The window ignores the mouse except over the pet. -->
  <main class="board" id="board" tabindex="-1">
    <div class="board-glow" id="board-glow" aria-hidden="true"></div>
    <div class="world" id="world"><svg class="links" id="links" aria-hidden="true"></svg></div>
    <div class="pets" id="pets" aria-label="Pet"></div>
  </main>
  <div class="popover" id="popover" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="timer" id="timer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
  <script type="module" src="pet.js"></script>
</body>
</html>
