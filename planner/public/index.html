<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="robots" content="noindex,nofollow">
  <meta name="planner-api" content="/api/state">
  <meta name="planner-ics" content="/api/ics">
  <meta name="planner-canvas" content="/api/canvas">
  <title>Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='11' height='9' rx='2' fill='%23d8ff5a'/%3E%3Crect x='18' y='5' width='11' height='15' rx='2' fill='%237cc7ff'/%3E%3Crect x='3' y='18' width='11' height='9' rx='2' fill='%23ff9e7a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="pets.css">
  <link rel="stylesheet" href="inbox.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Planner home"><span class="brand-mark" aria-hidden="true"></span>Planner</a>
    <!-- One box for everything: type to add a task (quick-add syntax), find lists and tasks, or "/" for commands. -->
    <div class="search omni" id="omni">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="search" type="search" placeholder="Add a task, find anything, or type / for commands" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="omni-list" aria-autocomplete="list" aria-label="Add, find or run a command">
      <kbd class="omni-kbd">⌘K</kbd>
      <div class="omni-pop" id="omni-pop" hidden><div class="omni-list" id="omni-list" role="listbox"></div><div class="omni-foot" id="omni-foot"></div></div>
    </div>
    <div class="top-actions">
      <button class="now-chip" id="now-chip" hidden></button>
      <button class="icon-btn top-btn" id="brief-btn" title="Morning brief (B)" aria-label="Morning brief">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15h14M5.5 15a4.5 4.5 0 0 1 9 0M10 4v2.5M4.2 7.2l1.6 1.6M15.8 7.2l-1.6 1.6"/></svg>
        <span class="top-dot" id="brief-dot" hidden></span>
      </button>
      <button class="icon-btn top-btn" id="voice-btn" title="Voice note (V)" aria-label="Voice note">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg>
        <span class="top-count" id="voice-count" hidden></span>
      </button>
      <div class="pets-ctl" title="Pet">
        <button class="icon-btn" id="pets-btn" aria-label="Pet settings">
          <svg viewBox="0 0 20 20" aria-hidden="true" class="paw"><ellipse cx="10" cy="13.2" rx="3.6" ry="3"/><ellipse cx="5" cy="9" rx="1.6" ry="2"/><ellipse cx="8.2" cy="5.8" rx="1.6" ry="2.1"/><ellipse cx="11.8" cy="5.8" rx="1.6" ry="2.1"/><ellipse cx="15" cy="9" rx="1.6" ry="2"/></svg>
        </button>
        <button class="pet-nav" id="pet-prev" aria-label="Previous pet">‹</button>
        <button class="pet-current" id="pet-current" title="Pet"><img id="pet-thumb" alt=""><span id="pet-name">奶龙</span></button>
        <button class="pet-nav" id="pet-next" aria-label="Next pet">›</button>
      </div>
      <span class="save-dot" id="save-dot" title="Saved"></span>
      <button class="icon-btn" id="theme-btn" title="Light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7Z"/></svg>
      </button>
      <button class="icon-btn" id="side-btn" title="Side panel (\)" aria-label="Toggle side panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12.5 3.5v13"/></svg>
      </button>
      <button id="quick-add-btn" hidden></button>
    </div>
  </header>

  <div class="layout">
    <main class="board" id="board" tabindex="-1" aria-label="Whiteboard">
      <div class="board-glow" id="board-glow" aria-hidden="true"></div>
      <div class="world" id="world">
        <svg class="links" id="links" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker></defs></svg>
      </div>
      <div class="pets" id="pets" aria-label="Pets"></div>
      <div class="board-hint" id="board-hint">Drag to pan · pinch or ⌘-scroll to zoom · double-click to add a list</div>
      <!-- Board tools: make things, move around, find what's hidden. -->
      <div class="dock" id="dock" role="toolbar" aria-label="Board">
        <button class="dock-btn" id="add-list" title="New list (L)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="14" height="13" rx="2.5"/><path d="M6.5 8h7M6.5 11h5"/></svg><span>List</span></button>
        <button class="dock-btn" id="add-note" title="New sticky note"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h12v8.5l-4 4.5H4z"/><path d="M12 16.5V12h4"/></svg><span>Note</span></button>
        <span class="dock-sep" aria-hidden="true"></span>
        <div class="zoom">
          <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
          <button class="zoom-level" id="zoom-level" title="Reset zoom">100%</button>
          <button class="icon-btn" id="zoom-in" aria-label="Zoom in">＋</button>
        </div>
        <button class="dock-btn icon" id="zoom-fit" title="Fit everything (F)" aria-label="Fit everything"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
        <button class="dock-btn icon" id="map-btn" title="Map (M)" aria-label="Map" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5 7.5 3.5l5 2 4.5-2v11l-4.5 2-5-2L3 16.5z"/><path d="M7.5 3.5v11M12.5 5.5v11"/></svg></button>
        <span class="dock-slot" id="dock-hidden"></span>
      </div>
      <div class="minimap" id="minimap" hidden><canvas id="minimap-canvas" aria-label="Map of the board: click to go there"></canvas></div>
    </main>

    <aside class="side" id="side" aria-label="Side panel">
      <div class="side-resize" id="side-resize" title="Drag to resize" aria-hidden="true"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="today" aria-selected="true" title="Today (1)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M3 8h14M7 2.5v3M13 2.5v3M7.5 12l2 2 3.5-3.5"/></svg><span>Today</span></button>
        <button role="tab" data-tab="brief" title="Morning brief (2)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15h14M5.5 15a4.5 4.5 0 0 1 9 0M10 4v2.5M4.2 7.2l1.6 1.6M15.8 7.2l-1.6 1.6"/></svg><span>Brief</span><i class="tab-dot" id="tab-brief-dot" hidden></i></button>
        <button role="tab" data-tab="voice" title="Voice Inbox (3)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg><span>Voice</span><b class="tab-count" id="tab-voice-count" hidden></b></button>
        <button role="tab" data-tab="calendar" title="Calendar (4)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/><circle cx="7" cy="11.5" r=".6"/><circle cx="10" cy="11.5" r=".6"/><circle cx="13" cy="11.5" r=".6"/><circle cx="7" cy="14" r=".6"/><circle cx="10" cy="14" r=".6"/></svg><span>Calendar</span></button>
        <button role="tab" data-tab="settings" title="Settings (5)"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M2.5 10h2M15.5 10h2M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg><span>Settings</span></button>
      </nav>
      <section class="pane" id="pane-today" role="tabpanel"></section>
      <section class="pane pane-inbox" id="pane-brief" role="tabpanel" hidden></section>
      <section class="pane pane-inbox" id="pane-voice" role="tabpanel" hidden></section>
      <section class="pane" id="pane-calendar" role="tabpanel" hidden></section>
      <section class="pane" id="pane-settings" role="tabpanel" hidden></section>
    </aside>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="timer" id="timer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
