<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="planner-api" content="/api/state">
  <meta name="planner-ics" content="/api/ics">
  <meta name="planner-canvas" content="/api/canvas">
  <title>Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='11' height='9' rx='2' fill='%23d8ff5a'/%3E%3Crect x='18' y='5' width='11' height='15' rx='2' fill='%237cc7ff'/%3E%3Crect x='3' y='18' width='11' height='9' rx='2' fill='%23ff9e7a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Planner home"><span class="brand-mark" aria-hidden="true"></span>Planner</a>
    <div class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="search" type="search" placeholder="Search tasks  /" autocomplete="off" aria-label="Search tasks">
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="add-list" title="New list (L)"><span aria-hidden="true">＋</span> List</button>
      <button class="btn ghost" id="add-note" title="New sticky note"><span aria-hidden="true">＋</span> Note</button>
      <button class="btn primary" id="quick-add-btn" title="Quick add (N or ⌘K)">Quick add <kbd>N</kbd></button>
      <span class="save-dot" id="save-dot" title="Saved"></span>
      <button class="icon-btn" id="theme-btn" title="Light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7Z"/></svg>
      </button>
      <button class="icon-btn" id="side-btn" title="Toggle side panel (\)" aria-label="Toggle side panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12.5 3.5v13"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <main class="board" id="board" tabindex="-1" aria-label="Whiteboard">
      <div class="world" id="world">
        <svg class="links" id="links" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker></defs></svg>
      </div>
      <div class="board-hint" id="board-hint">Drag to pan · pinch or ⌘-scroll to zoom · double-click to add a list</div>
      <div class="zoom">
        <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="zoom-level" id="zoom-level" title="Reset zoom">100%</button>
        <button class="icon-btn" id="zoom-in" aria-label="Zoom in">＋</button>
        <button class="icon-btn" id="zoom-fit" title="Fit everything (F)" aria-label="Fit everything">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
        </button>
      </div>
    </main>

    <aside class="side" id="side" aria-label="Side panel">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="today" aria-selected="true">Today</button>
        <button role="tab" data-tab="calendar">Calendar</button>
        <button role="tab" data-tab="settings">Settings</button>
      </nav>
      <section class="pane" id="pane-today" role="tabpanel"></section>
      <section class="pane" id="pane-calendar" role="tabpanel" hidden></section>
      <section class="pane" id="pane-settings" role="tabpanel" hidden></section>
    </aside>
  </div>

  <dialog class="quick" id="quick">
    <form method="dialog" id="quick-form">
      <input id="quick-input" autocomplete="off" placeholder="hw3 fri 5pm #canvas ~2h !high" aria-label="New task">
      <div class="quick-preview" id="quick-preview"></div>
      <p class="quick-help">#list · fri / tomorrow / 11/2 / dec 1 · 5pm · ~2h / ~45m · !high !! ! · every week</p>
    </form>
  </dialog>

  <div class="popover" id="popover" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="timer" id="timer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
